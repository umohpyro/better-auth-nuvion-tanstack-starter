name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NUVION_API_KEY: ci-placeholder
      NUVION_WEBHOOK_SECRET: nv_wsk_ci_placeholder
      DB_PATH: ./ci.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run migrate
      - run: npm run build
      - run: npm run typecheck
